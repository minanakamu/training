<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>腹筋HIITタイマー</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --rest: #16a34a;
      --danger: #dc2626;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 560px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 14px;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 15px;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      background: #dbeafe;
      color: #1e40af;
      margin-bottom: 16px;
    }

    .status.rest {
      background: #dcfce7;
      color: #166534;
    }

    .status.finished {
      background: #fee2e2;
      color: #991b1b;
    }

    .exercise {
      font-size: 34px;
      font-weight: 800;
      margin: 8px 0 12px;
      line-height: 1.25;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: 92px;
      font-weight: 900;
      letter-spacing: -4px;
      line-height: 1;
      margin: 12px 0 20px;
      text-align: center;
    }

    .progress-wrap {
      width: 100%;
      height: 16px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0 18px;
    }

    .progress {
      height: 100%;
      width: 100%;
      background: var(--primary);
      transition: width 0.2s linear, background 0.2s linear;
    }

    .progress.rest {
      background: var(--rest);
    }

    .next {
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 16px;
      min-height: 24px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      background: var(--primary);
      min-height: 56px;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: #4b5563;
    }

    button.secondary:hover {
      background: #374151;
    }

    button.danger {
      background: var(--danger);
    }

    button.danger:hover {
      background: #b91c1c;
    }

    button.small {
      padding: 10px 12px;
      min-height: 42px;
      font-size: 14px;
      border-radius: 10px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .menu {
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .menu h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }

    ol {
      margin: 0;
      padding-left: 22px;
    }

    li {
      margin: 8px 0;
      font-size: 15px;
      color: #374151;
    }

    .current-step {
      font-weight: 800;
      color: var(--primary);
    }

    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .form-row {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      background: #ffffff;
      color: var(--text);
    }

    textarea {
      resize: vertical;
      min-height: 92px;
    }

    .diary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .entries {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    .entry {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #fbfdff;
    }

    .entry-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .entry-date {
      font-weight: 900;
      font-size: 16px;
    }

    .entry-meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .entry-note {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14px;
      margin-top: 8px;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      margin: 8px 0 0;
    }

    @media (max-width: 420px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 20px;
      }

      .exercise {
        font-size: 28px;
      }

      .timer {
        font-size: 78px;
      }

      .buttons,
      .diary-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>腹筋HIITタイマー</h1>
      <p class="subtitle">45秒トレーニング / 15秒休憩 / 2周</p>

      <div id="status" class="status">準備</div>
      <div id="exercise" class="exercise">スタートを押してください</div>
      <div id="timer" class="timer">00:45</div>

      <div class="progress-wrap" aria-label="進捗">
        <div id="progress" class="progress"></div>
      </div>

      <div id="next" class="next">次：レッグレイズ</div>

      <div class="buttons">
        <button id="startPauseBtn">スタート</button>
        <button id="skipBtn" class="secondary">次へ</button>
        <button id="resetBtn" class="danger">リセット</button>
        <button id="soundBtn" class="secondary">音テスト</button>
      </div>

      <div class="menu">
        <h2>メニュー</h2>
        <ol id="menuList"></ol>
        <p class="hint">
          ※ スマホで音が小さい場合は、端末の音量・消音モード・ブラウザの音声許可を確認してください。音は以前より大きめにしています。
        </p>
      </div>
    </section>

    <section class="card">
      <h2>トレーニング日記</h2>
      <p class="subtitle">記録はこの端末のブラウザ内に保存されます。サーバーは不要です。</p>

      <div class="form-row">
        <label for="diaryDate">日付</label>
        <input id="diaryDate" type="date" />
      </div>

      <div class="form-row">
        <label for="diaryCondition">今日の状態</label>
        <select id="diaryCondition">
          <option value="普通">普通</option>
          <option value="軽め">軽め</option>
          <option value="きつい">きつい</option>
          <option value="かなり余裕">かなり余裕</option>
          <option value="途中で中断">途中で中断</option>
        </select>
      </div>

      <div class="form-row">
        <label for="diaryNote">メモ</label>
        <textarea id="diaryNote" placeholder="例：レッグレイズがきつかった。プランクは余裕あり。"></textarea>
      </div>

      <div class="diary-actions">
        <button id="saveDiaryBtn">記録する</button>
        <button id="exportBtn" class="secondary">CSV出力</button>
        <button id="clearFormBtn" class="secondary">入力クリア</button>
        <button id="deleteAllBtn" class="danger">全記録削除</button>
      </div>

      <div id="entries" class="entries"></div>
    </section>
  </main>

  <script>
    const exercises = [
      "レッグレイズ",
      "リバースクランチ",
      "プランク",
      "マウンテンクライマー"
    ];

    const workSeconds = 45;
    const restSeconds = 15;
    const rounds = 2;
    const diaryStorageKey = "abWorkoutDiaryEntries_v1";

    const steps = [];
    for (let round = 1; round <= rounds; round++) {
      exercises.forEach((name, index) => {
        steps.push({
          type: "work",
          name,
          duration: workSeconds,
          label: `${round}周目：${name}`
        });

        if (!(round === rounds && index === exercises.length - 1)) {
          steps.push({
            type: "rest",
            name: "休憩",
            duration: restSeconds,
            label: "休憩"
          });
        }
      });
    }

    let currentStep = 0;
    let remaining = steps[0].duration;
    let running = false;
    let intervalId = null;
    let audioCtx = null;
    let soundVolume = 0.85;

    const statusEl = document.getElementById("status");
    const exerciseEl = document.getElementById("exercise");
    const timerEl = document.getElementById("timer");
    const progressEl = document.getElementById("progress");
    const nextEl = document.getElementById("next");
    const startPauseBtn = document.getElementById("startPauseBtn");
    const skipBtn = document.getElementById("skipBtn");
    const resetBtn = document.getElementById("resetBtn");
    const soundBtn = document.getElementById("soundBtn");
    const menuList = document.getElementById("menuList");

    const diaryDateEl = document.getElementById("diaryDate");
    const diaryConditionEl = document.getElementById("diaryCondition");
    const diaryNoteEl = document.getElementById("diaryNote");
    const saveDiaryBtn = document.getElementById("saveDiaryBtn");
    const exportBtn = document.getElementById("exportBtn");
    const clearFormBtn = document.getElementById("clearFormBtn");
    const deleteAllBtn = document.getElementById("deleteAllBtn");
    const entriesEl = document.getElementById("entries");

    function initMenu() {
      menuList.innerHTML = "";
      exercises.forEach((name, index) => {
        const li = document.createElement("li");
        li.textContent = `${name} 45秒 → 休憩15秒`;
        if (index === exercises.length - 1) li.textContent = `${name} 45秒`;
        menuList.appendChild(li);
      });
    }

    function formatTime(seconds) {
      const min = String(Math.floor(seconds / 60)).padStart(2, "0");
      const sec = String(seconds % 60).padStart(2, "0");
      return `${min}:${sec}`;
    }

    function todayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function beep(frequency = 1200, duration = 0.22, volume = soundVolume) {
      ensureAudio();

      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const compressor = audioCtx.createDynamicsCompressor();

      oscillator.type = "square";
      oscillator.frequency.value = frequency;

      compressor.threshold.value = -24;
      compressor.knee.value = 30;
      compressor.ratio.value = 12;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.25;

      gain.gain.value = Math.max(0.0001, Math.min(volume, 1));

      oscillator.connect(gain);
      gain.connect(compressor);
      compressor.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      oscillator.start(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      oscillator.stop(now + duration);
    }

    function startSignal() {
      beep(900, 0.16, 0.8);
      setTimeout(() => beep(1300, 0.22, 0.9), 170);
    }

    function finishSignal() {
      beep(1000, 0.18, 0.9);
      setTimeout(() => beep(1300, 0.18, 0.9), 220);
      setTimeout(() => beep(1600, 0.35, 1.0), 440);
      if (navigator.vibrate) navigator.vibrate([200, 80, 200]);
    }

    function countdownSignal() {
      beep(1500, 0.11, 0.7);
      if (navigator.vibrate) navigator.vibrate(60);
    }

    function updateDisplay() {
      const step = steps[currentStep];
      const total = step ? step.duration : 1;
      const progress = step ? (remaining / total) * 100 : 0;

      timerEl.textContent = formatTime(remaining);
      progressEl.style.width = `${progress}%`;

      statusEl.className = "status";
      progressEl.className = "progress";

      if (!step) {
        statusEl.textContent = "完了";
        statusEl.classList.add("finished");
        exerciseEl.textContent = "お疲れさまでした";
        nextEl.textContent = "トレーニング終了";
        startPauseBtn.textContent = "スタート";
        return;
      }

      if (step.type === "work") {
        statusEl.textContent = "トレーニング";
        exerciseEl.textContent = step.label;
      } else {
        statusEl.textContent = "休憩";
        statusEl.classList.add("rest");
        progressEl.classList.add("rest");
        exerciseEl.textContent = "休憩";
      }

      const nextStep = steps[currentStep + 1];
      nextEl.textContent = nextStep ? `次：${nextStep.label}` : "次：終了";

      [...menuList.children].forEach(li => li.classList.remove("current-step"));
      if (step.type === "work") {
        const exerciseIndex = exercises.indexOf(step.name);
        if (exerciseIndex >= 0) menuList.children[exerciseIndex].classList.add("current-step");
      }
    }

    function goNext() {
      currentStep++;

      if (currentStep >= steps.length) {
        currentStep = steps.length;
        remaining = 0;
        running = false;
        clearInterval(intervalId);
        intervalId = null;
        finishSignal();
        updateDisplay();
        return;
      }

      remaining = steps[currentStep].duration;
      startSignal();
      updateDisplay();
    }

    function tick() {
      if (!running) return;

      if (remaining > 1) {
        remaining--;

        if (remaining <= 3 && remaining > 0) {
          countdownSignal();
        }

        updateDisplay();
      } else {
        remaining = 0;
        updateDisplay();
        goNext();
      }
    }

    function startPause() {
      ensureAudio();

      if (currentStep >= steps.length) {
        reset();
      }

      running = !running;
      startPauseBtn.textContent = running ? "一時停止" : "再開";

      if (running) {
        startSignal();
        if (!intervalId) {
          intervalId = setInterval(tick, 1000);
        }
      }

      updateDisplay();
    }

    function reset() {
      running = false;
      clearInterval(intervalId);
      intervalId = null;
      currentStep = 0;
      remaining = steps[0].duration;
      startPauseBtn.textContent = "スタート";
      updateDisplay();
    }

    function skip() {
      ensureAudio();
      goNext();
    }

    function getEntries() {
      try {
        return JSON.parse(localStorage.getItem(diaryStorageKey)) || [];
      } catch {
        return [];
      }
    }

    function saveEntries(entries) {
      localStorage.setItem(diaryStorageKey, JSON.stringify(entries));
    }

    function clearForm() {
      diaryDateEl.value = todayString();
      diaryConditionEl.value = "普通";
      diaryNoteEl.value = "";
    }

    function saveDiary() {
      const date = diaryDateEl.value || todayString();
      const condition = diaryConditionEl.value;
      const note = diaryNoteEl.value.trim();

      const entries = getEntries();
      entries.unshift({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        date,
        condition,
        note,
        createdAt: new Date().toISOString()
      });

      saveEntries(entries);
      diaryNoteEl.value = "";
      renderEntries();
    }

    function deleteEntry(id) {
      const entries = getEntries().filter(entry => entry.id !== id);
      saveEntries(entries);
      renderEntries();
    }

    function renderEntries() {
      const entries = getEntries();
      entriesEl.innerHTML = "";

      if (entries.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "まだ記録はありません。";
        entriesEl.appendChild(empty);
        return;
      }

      entries.forEach(entry => {
        const item = document.createElement("div");
        item.className = "entry";

        const head = document.createElement("div");
        head.className = "entry-head";

        const info = document.createElement("div");
        const date = document.createElement("div");
        date.className = "entry-date";
        date.textContent = entry.date;

        const meta = document.createElement("div");
        meta.className = "entry-meta";
        meta.textContent = `状態：${entry.condition}`;

        info.appendChild(date);
        info.appendChild(meta);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "danger small";
        deleteBtn.textContent = "削除";
        deleteBtn.addEventListener("click", () => {
          if (confirm("この記録を削除しますか？")) deleteEntry(entry.id);
        });

        head.appendChild(info);
        head.appendChild(deleteBtn);

        const note = document.createElement("div");
        note.className = "entry-note";
        note.textContent = entry.note || "メモなし";

        item.appendChild(head);
        item.appendChild(note);
        entriesEl.appendChild(item);
      });
    }

    function exportCsv() {
      const entries = getEntries();

      if (entries.length === 0) {
        alert("出力する記録がありません。");
        return;
      }

      const header = ["date", "condition", "note", "createdAt"];
      const rows = entries.map(entry => [
        entry.date,
        entry.condition,
        entry.note || "",
        entry.createdAt || ""
      ]);

      const csv = [header, ...rows]
        .map(row => row.map(value => `"${String(value).replaceAll('"', '""')}"`).join(","))
        .join("\n");

      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ab-workout-diary-${todayString()}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    startPauseBtn.addEventListener("click", startPause);
    resetBtn.addEventListener("click", reset);
    skipBtn.addEventListener("click", skip);
    soundBtn.addEventListener("click", () => {
      startSignal();
      setTimeout(finishSignal, 600);
    });

    saveDiaryBtn.addEventListener("click", saveDiary);
    clearFormBtn.addEventListener("click", clearForm);
    exportBtn.addEventListener("click", exportCsv);
    deleteAllBtn.addEventListener("click", () => {
      if (confirm("全ての記録を削除しますか？この操作は戻せません。")) {
        saveEntries([]);
        renderEntries();
      }
    });

    initMenu();
    clearForm();
    renderEntries();
    updateDisplay();
  </script>
</body>
</html>
